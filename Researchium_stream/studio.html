<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta id="cspMeta" http-equiv="Content-Security-Policy" content=""/>
  <title>Researchium Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/meet.css"/>
  <style>
    :root {
      --bg: #0a0c10;
      --bg2: #12151c;
      --bg3: #1a1f2a;
      --bg4: #222836;
      --border: rgba(255,255,255,.08);
      --text: #f1f3f9;
      --text2: #9aa3b8;
      --text3: #5c6578;
      --accent: #3b82f6;
      --accent-dim: #2563eb;
      --purple: #8b5cf6;
      --red: #ef4444;
      --red-bg: rgba(239,68,68,.15);
      --amber: #f59e0b;
      --green: #22c55e;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
      --mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .hidden { display: none !important; }

    /* Top bar */
    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }
    .btn-ghost {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text2);
      border-radius: 8px;
    }
    .btn-ghost:hover { background: var(--bg3); color: var(--text); }
    .studio-logo {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text);
    }
    .studio-logo span { color: var(--purple); }
    .status-pills {
      display: flex;
      gap: 16px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      letter-spacing: 0.06em;
    }
    .status-pills strong { color: var(--text2); font-weight: 700; }
    .btn-golive {
      padding: 10px 22px;
      background: var(--red);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      border-radius: 8px;
    }
    .btn-golive:hover { filter: brightness(1.08); }
    .btn-golive.is-live { background: #374151; }

    /* Main layout */
    .studio-main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* Scenes */
    .scenes-panel {
      width: 200px;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .scenes-head {
      padding: 14px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: 0.08em;
    }
    .btn-add-scene {
      margin: 0 10px 12px;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      width: calc(100% - 20px);
    }
    .btn-add-scene:hover { border-color: var(--purple); color: var(--text); }
    .scene-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
    .scene-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .scene-item:hover { background: var(--bg3); }
    .scene-item.active { border-color: var(--accent); background: rgba(59,130,246,.08); }
    .scene-thumb {
      width: 56px;
      height: 36px;
      border-radius: 6px;
      background: var(--bg4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .scene-thumb video { width: 100%; height: 100%; object-fit: cover; }
    .scene-name { font-size: 12px; font-weight: 600; }

    /* Center */
    .center-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 16px;
    }
    .media-alert {
      display: none;
      padding: 10px 14px;
      background: rgba(245,158,11,.12);
      border: 1px solid rgba(245,158,11,.35);
      border-radius: 8px;
      font-size: 13px;
      color: #fcd34d;
      margin-bottom: 12px;
    }
    .media-alert.show { display: block; }
    .previews-row {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 16px;
      min-height: 0;
    }
    .preview-frame {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .preview-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      margin-bottom: 8px;
      letter-spacing: 0.06em;
    }
    .preview-stage {
      position: relative;
      flex: 1;
      background: #0f1117;
      border-radius: 12px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    .preview-stage video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple), var(--amber));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
    }
    .watermark {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,.25);
    }
    .host-badge {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,.6);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .host-badge .dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; }
    .layout-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      justify-content: center;
    }
    .layout-btn {
      width: 44px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg3);
      border: 1px solid var(--border);
      font-size: 14px;
      opacity: 0.6;
    }
    .layout-btn:hover, .layout-btn.active {
      opacity: 1;
      border-color: var(--accent);
      background: rgba(59,130,246,.15);
    }

    /* Right tools */
    .tools-rail {
      width: 56px;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 4px;
      flex-shrink: 0;
    }
    .tool-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      font-size: 18px;
      color: var(--text2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .tool-btn:hover { background: var(--bg3); color: var(--text); }
    .tool-btn.active { background: rgba(59,130,246,.2); color: var(--accent); }
    .tool-btn .badge {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
    }

    /* Side drawer */
    .drawer {
      position: fixed;
      top: 52px;
      right: 56px;
      bottom: 72px;
      width: 320px;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.2s;
      z-index: 50;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-head h3 { font-size: 15px; font-weight: 700; }
    .drawer-close { font-size: 20px; color: var(--text2); padding: 4px 8px; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 12px; }
    .chat-messages { display: flex; flex-direction: column; gap: 10px; }
    .chat-msg {
      font-size: 13px;
      padding: 10px 12px;
      background: var(--bg3);
      border-radius: 10px;
      line-height: 1.45;
    }
    .chat-msg strong { display: block; font-size: 11px; color: var(--accent); margin-bottom: 4px; }
    .chat-input-row {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .chat-input-row input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    .guest-card {
      padding: 12px;
      background: var(--bg3);
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .guest-card p { color: var(--text2); font-size: 12px; margin-top: 6px; }
    .btn-sm {
      margin-top: 10px;
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Bottom bar */
    .bottombar {
      height: 72px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .bottom-left { display: flex; gap: 10px; }
    .btn-private-chat {
      padding: 10px 16px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .controls-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg4);
      border: 1px solid var(--border);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: var(--bg3); }
    .ctrl-btn.off {
      background: var(--red-bg);
      border-color: rgba(239,68,68,.4);
    }
    .ctrl-btn .label {
      position: absolute;
      bottom: -18px;
      font-size: 10px;
      color: var(--text3);
      white-space: nowrap;
      left: 50%;
      transform: translateX(-50%);
    }
    .ctrl-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }

    .scene-mode {
      display: flex;
      gap: 4px;
      padding: 0 10px 10px;
    }
    .scene-mode button {
      flex: 1;
      padding: 6px 4px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border);
      color: var(--text3);
    }
    .scene-mode button.active {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(59,130,246,.12);
    }
    .overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    .overlay-card {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      opacity: 0;
      transition: opacity .35s, transform .35s;
      background: rgba(10,12,16,.92);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      min-width: 160px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }
    .overlay-card.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .overlay-card.pos-top { top: 12%; }
    .overlay-card.pos-top-right { top: 10%; right: 8%; left: auto; transform: translateY(-12px); }
    .overlay-card.pos-top-right.show { transform: translateY(0); }
    .overlay-card.pos-bottom-left { bottom: 14%; left: 8%; top: auto; transform: translateY(12px); }
    .overlay-card.pos-bottom-left.show { transform: translateY(0); }
    .overlay-donation { border-color: var(--amber); }
    .overlay-follower { border-color: var(--green); }
    .overlay-title { font-size: 15px; font-weight: 800; }
    .overlay-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .analytics-pills .plat-stat {
      margin-left: 10px;
      color: var(--text3);
    }
    .analytics-pills .plat-stat.live strong { color: var(--green); }
    .analytics-pills .plat-stat strong { color: var(--text); }
    .controls-section { margin-bottom: 20px; }
    .controls-section h4 {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .controls-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .controls-row input {
      flex: 1;
      min-width: 80px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-size: 12px;
    }
    .btn-studio-sm {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg3);
    }
    .btn-studio-sm:hover { border-color: var(--purple); }
    .btn-studio-sm.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .follower-list { font-size: 12px; color: var(--text2); }
    .follower-list li { padding: 6px 0; border-bottom: 1px solid var(--border); }

    @media (max-width: 900px) {
      .previews-row { grid-template-columns: 1fr; }
      .scenes-panel { width: 160px; }
      .drawer { width: 100%; right: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="stream-dashboard.html" class="btn-ghost">← Dashboard</a>
      <button type="button" class="btn-ghost" id="btnSchedule">SCHEDULE</button>
    </div>
    <div class="studio-logo">RESEARCHIUM <span>STUDIO</span> LIVE</div>
    <div class="topbar-right">
      <div class="status-pills analytics-pills">
        <span id="reactViewerTopbar"></span>
        <span id="legacyViewerPills" style="display:none">VIEWERS <strong id="totalViewers">0</strong></span>
        <span id="platformViewers" style="display:none"></span>
        <span>LIVE STREAM <strong id="streamQuality">720p</strong></span>
        <span>RECORDING <strong id="recStatus">OFF</strong></span>
      </div>
      <button type="button" class="btn-golive" id="btnGoLive">GO LIVE</button>
    </div>
  </header>

  <div class="studio-main">
    <aside class="scenes-panel">
      <div class="scenes-head">SCENES</div>
      <div class="scene-mode" role="group" aria-label="Scene source">
        <button type="button" class="active" id="sceneModeBrowser" data-mode="browser">Browser</button>
        <button type="button" id="sceneModeObs" data-mode="obs">OBS</button>
      </div>
      <button type="button" class="btn-add-scene" id="btnAddScene">+ ADD SCENE</button>
      <div class="scene-list" id="sceneList"></div>
      <p id="obsSceneHint" style="font-size:10px;color:var(--text3);padding:8px 12px;display:none">Connect OBS in Graphics → Studio controls</p>
    </aside>

    <section class="center-panel">
      <div class="media-alert" id="mediaAlert"></div>
      <div class="meet-view hidden" id="meetView">
        <div class="meet-grid-wrap">
          <div class="meet-grid count-1" id="meetGrid"></div>
        </div>
      </div>
      <div class="previews-row" id="broadcastView">
        <div class="preview-frame">
          <div class="preview-label">Portrait</div>
          <div class="preview-stage" id="stagePortrait">
            <video id="videoPortrait" autoplay muted playsinline style="display:none"></video>
            <div class="preview-avatar" id="avatarPortrait">RS</div>
            <span class="watermark">RESEARCHIUM</span>
            <div class="host-badge"><span class="dot"></span><span id="hostLabel">You</span></div>
          </div>
        </div>
        <div class="preview-frame">
          <div class="preview-label">Landscape</div>
          <div class="preview-stage" id="stageLandscape">
            <video id="videoLandscape" autoplay muted playsinline style="display:none"></video>
            <div class="preview-avatar" id="avatarLandscape">RS</div>
            <span class="watermark">RESEARCHIUM</span>
          </div>
        </div>
      </div>
      <div id="reactStreamControls" style="padding:0 12px 12px"></div>
      <div class="layout-row hidden" id="layoutRow">
        <button type="button" class="layout-btn" data-layout="solo" title="Solo">▣</button>
        <button type="button" class="layout-btn active" data-layout="side" title="Side by side">▢▢</button>
        <button type="button" class="layout-btn" data-layout="pip" title="Picture in picture">◧</button>
        <button type="button" class="layout-btn" data-layout="grid" title="Grid">⊞</button>
        <button type="button" class="layout-btn" data-layout="present" title="Presenter">▤</button>
      </div>
    </section>

    <aside class="tools-rail">
      <button type="button" class="tool-btn" data-panel="people" title="People">👥</button>
      <button type="button" class="tool-btn" data-panel="guests" title="Add guest">👤</button>
      <button type="button" class="tool-btn" data-panel="graphics" title="Graphics">🎨</button>
      <button type="button" class="tool-btn" data-panel="captions" title="Captions">99</button>
      <button type="button" class="tool-btn" data-panel="chat" title="Chat"><span>💬</span><span class="badge" id="chatBadge"></span></button>
      <button type="button" class="tool-btn" data-panel="notes" title="Notes">📝</button>
      <button type="button" class="tool-btn" data-panel="music" title="Music">🎵</button>
      <button type="button" class="tool-btn" data-panel="theme" title="Theme">🎭</button>
      <button type="button" class="tool-btn" data-panel="help" title="Help">?</button>
    </aside>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h3 id="drawerTitle">Chat</h3>
      <button type="button" class="drawer-close" id="drawerClose" aria-label="Close">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="chat-input-row" id="drawerFooter" style="display:none">
      <input type="text" id="chatInput" placeholder="Say something…"/>
      <button type="button" class="btn-sm" id="chatSend">Send</button>
    </div>
  </aside>

  <footer class="bottombar">
    <div class="bottom-left meet-bar-info">
      <span id="meetClock">00:00</span>
      <span>|</span>
      <span class="code" id="meetCode" title="Meeting code"></span>
      <button type="button" class="btn-private-chat" id="btnPrivateChat" style="margin-left:8px">Chat</button>
    </div>
    <div class="controls-cluster">
      <div class="ctrl-wrap">
        <button type="button" class="ctrl-btn off" id="ctrlMic" title="Microphone">🎤</button>
      </div>
      <div class="ctrl-wrap">
        <button type="button" class="ctrl-btn off" id="ctrlCam" title="Camera">📹</button>
      </div>
      <div class="ctrl-wrap">
        <button type="button" class="ctrl-btn" id="ctrlScreen" title="Share screen">🖥</button>
      </div>
      <div class="ctrl-wrap">
        <button type="button" class="ctrl-btn" id="ctrlGuest" title="Invite guest">👤+</button>
      </div>
      <div class="ctrl-wrap">
        <button type="button" class="ctrl-btn" id="ctrlAdd" title="Add source">+</button>
      </div>
      <div class="ctrl-wrap">
        <button type="button" class="ctrl-btn" id="ctrlPeople" title="People">👥</button>
      </div>
      <div class="ctrl-wrap">
        <button type="button" class="ctrl-btn" id="ctrlSettings" title="Settings">⚙</button>
      </div>
      <div class="ctrl-wrap">
        <button type="button" class="ctrl-btn leave" id="ctrlLeave" title="Leave">📞</button>
      </div>
    </div>
    <div style="width:120px"></div>
  </footer>

  <script src="js/studio-env.js"></script>
  <script src="js/studio-csp.js"></script>
  <script>
    document.getElementById('cspMeta')?.setAttribute('content', window.ResearchiumCspMeta || '');
    if (window.ResearchiumStudioEnv) window.ResearchiumStudioEnv.configure();
    const signalingBase = window.RESEARCHIUM_STUDIO_URL || window.RESEARCHIUM_API_URL || '';
    if (signalingBase) {
      window.RESEARCHIUM_SIGNALING_URL = window.RESEARCHIUM_SIGNALING_URL || signalingBase;
    }
  </script>
  <script src="js/vendor/socket.io.min.js"></script>
  <script src="js/studio-safe.js"></script>
  <script src="js/studio-auth.js"></script>
  <script src="js/studio-api.js"></script>
  <script src="js/studio-media.js"></script>
  <script src="js/studio-room.js"></script>
  <script src="js/studio-signaling.js"></script>
  <script src="js/studio-webrtc.js"></script>
  <script src="js/unified-chat.js"></script>
  <script src="js/studio-controls.js"></script>
  <script src="js/stream-components-loader.js"></script>
  <script src="js/studio-page.js"></script>
</body>
</html>
