worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

rtmp {
  server {
    listen 1935;
    chunk_size 4096;

    application live {
      live on;
      record off;

      # Allow publisher from encoder / studio (restrict in production via allow/deny or on_publish)
      allow publish all;
      deny play all;

      # HLS preview (optional local playback)
      hls on;
      hls_path /var/hls;
      hls_fragment 2s;
      hls_playlist_length 10s;

      # Notify studio backend when a stream starts (optional)
      # on_publish http://backend:5000/api/rtmp/hooks/publish;
      # on_publish_done http://backend:5000/api/rtmp/hooks/publish_done;
    }
  }
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 8088;

    location /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /var;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }

    location /stat {
      rtmp_stat all;
      rtmp_stat_stylesheet stat.xsl;
    }
  }
}
