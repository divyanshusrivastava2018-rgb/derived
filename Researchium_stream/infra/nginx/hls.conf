# HLS edge — bind via docker-compose to 127.0.0.1 only in dev.
# Production: terminate TLS at ingress; use signed URLs for segments.

limit_req_zone $binary_remote_addr zone=hls_limit:10m rate=30r/s;

server {
  listen 80;
  server_tokens off;
  root /var/hls;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Set ALLOWED_ORIGINS in compose env and replace $hls_cors_origin at deploy time,
  # or use map + include for multiple origins.
  set $hls_cors_origin "http://localhost:3000";

  location /live/ {
    limit_req zone=hls_limit burst=60 nodelay;

    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
    }

    add_header Cache-Control "public, max-age=2" always;
    add_header Access-Control-Allow-Origin $hls_cors_origin always;
    add_header Vary Origin always;

    # Optional: secure_link on $uri$expires$secret;
    try_files $uri =404;
  }

  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
