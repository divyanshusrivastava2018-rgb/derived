<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://127.0.0.1:4000 http://localhost:4000; img-src 'self'; frame-ancestors 'none'; base-uri 'self'"/>
  <title>You left the meeting – Researchium</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --text: #202124;
      --muted: #5f6368;
      --accent: #8b5cf6;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      background: #fff;
    }
    .top {
      margin: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
    }
    .count {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--accent);
    }
    main {
      max-width: 560px;
      margin: 48px auto;
      padding: 0 24px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
    }
    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid #dadce0;
    }
    .card {
      text-align: left;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .card h2 { font-size: 18px; font-weight: 400; margin-bottom: 6px; }
    .card p { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .shield {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #8b5cf6, #f59e0b);
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="count" id="countdown">60</div>
    <span>Returning to dashboard…</span>
  </div>
  <main>
    <h1 id="heading">You left the meeting</h1>
    <div class="actions">
      <a class="btn btn-outline" id="btnRejoin" href="#">Rejoin</a>
      <a class="btn btn-primary" href="stream-dashboard.html">Return to dashboard</a>
    </div>
    <div class="card">
      <div class="shield" aria-hidden="true"></div>
      <div>
        <h2>Your meeting is safe</h2>
        <p>Only people with the invite link can join this Researchium studio room.</p>
      </div>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get('room') || '';
    const invalid = params.get('invalid') === '1';
    if (invalid) {
      document.getElementById('heading').textContent = 'Check your meeting code';
    }
    if (room) {
      document.getElementById('btnRejoin').href = `studio-lobby.html`;
    } else {
      document.getElementById('btnRejoin').style.display = 'none';
    }
    let n = 59;
    const el = document.getElementById('countdown');
    const t = setInterval(() => {
      el.textContent = String(n);
      if (n-- <= 0) {
        clearInterval(t);
        location.href = 'stream-dashboard.html';
      }
    }, 1000);
  </script>
</body>
</html>
