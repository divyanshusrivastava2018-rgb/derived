<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message sent – Researchium</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      .thanks-wrap {
        max-width: 520px;
        margin: 4rem auto 6rem;
        padding: 2.5rem 2rem;
        text-align: center;
        font-family: 'Inter', sans-serif;
      }
      .thanks-wrap h1 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.75rem;
        margin-bottom: 0.75rem;
        color: #0f172a;
      }
      .thanks-wrap p {
        color: #64748b;
        line-height: 1.65;
        margin-bottom: 1.75rem;
      }
      .thanks-actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: stretch;
      }
      .thanks-btn-primary {
        display: block;
        padding: 0.9rem 1.25rem;
        border-radius: 999px;
        background: #1e3a5f;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        text-align: center;
      }
      .thanks-btn-primary:hover {
        background: #152a47;
      }
      .thanks-btn-secondary {
        display: block;
        padding: 0.85rem 1.25rem;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        color: #334155;
        font-weight: 600;
        text-decoration: none;
        text-align: center;
      }
      .thanks-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        border-radius: 50%;
        background: #dcfce7;
        color: #16a34a;
        font-size: 1.75rem;
        line-height: 56px;
      }
    </style>
  </head>
  <body class="site-page" data-page="contact-thanks">
    <header id="site-header" class="site-header-mount"></header>
    <main class="inner-main">
      <div class="thanks-wrap">
        <div class="thanks-icon" aria-hidden="true">✓</div>
        <h1>Message sent</h1>
        <p>
          Thank you for contacting Researchium. Your message has been delivered to our team and we will reply to your email soon.
        </p>
        <div class="thanks-actions">
          <a class="thanks-btn-primary" href="/csir-net.html">Back to CSIR NET</a>
          <a class="thanks-btn-secondary" href="/">Go to home</a>
        </div>
      </div>
    </main>
    <footer class="site-footer site-footer-extended">
      <div id="site-footer-main"></div>
    </footer>
    <script defer src="/js/researchium-chrome.js"></script>
  </body>
</html>
