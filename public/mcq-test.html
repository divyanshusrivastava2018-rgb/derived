<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock Test Series – Researchium</title>
    <meta name="description" content="Year-wise GATE and category-wise MCQ mock tests — Researchium Mathematical Science." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/mcq-mock-cards.css" />
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" as="style" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/css/math-content.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  </head>
  <body class="site-page" data-page="mcq">
    <header id="site-header" class="site-header-mount"><a href="/" class="site-nav__brand site-nav__brand--preload" aria-label="Researchium home"><img src="/images/researchium-logo.png?v=header6" alt="Researchium" class="site-nav__logo-img" width="1024" height="210" decoding="async" fetchpriority="high" /></a></header>
    <script src="/js/researchium-chrome.js"></script>

    <main class="inner-main">
      <div class="page-hero">
        <div class="sec-tag">MOCK TEST SERIES</div>
        <h1>MCQ <span class="gold">Practice</span></h1>
        <p>Choose a mock test token — GATE papers year-wise or PDF study categories.</p>
      </div>

      <section id="mock-test-series" class="mock-series-wrap">
        <div id="mockFilterTabs" class="mock-year-tabs" role="tablist"></div>
        <div id="mockCardsGrid" class="mock-cards-grid">
          <p class="mock-cards-empty">Loading mock tests…</p>
        </div>
        <p id="mockLoadError" class="admin-muted" style="text-align:center;margin-top:1rem;display:none"></p>
      </section>

      <section id="categoryQuizPanel" class="section admin-card mock-quiz-panel" style="max-width:900px;margin:0 auto 3rem;display:none">
        <h2 id="quizPanelTitle" style="font-size:1.2rem;margin-bottom:0.75rem">Category practice</h2>
        <div class="cta-row" style="margin-bottom:1rem">
          <button type="button" class="btn-gold" id="btnGenerateMcq">Start practice</button>
          <button type="button" class="btn-ghost" id="btnSubmitMcq" disabled>Submit answers</button>
          <button type="button" class="btn-ghost" id="btnCloseQuiz">Close</button>
        </div>
        <div id="mcqForm"></div>
        <p id="mcqResult" class="admin-muted" style="margin-top:1rem;font-weight:600"></p>
      </section>
    </main>

    <footer class="site-footer site-footer-extended">
      <div id="site-footer-main"></div>
      <div class="footer-bottom">
        <p>© 2026 Researchium Learning Pvt. Ltd.</p>
      </div>
    </footer>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    <script defer src="/js/math-render.js"></script>
    <script defer src="/js/researchium-core.js"></script>
    <script defer src="/js/mcq-test.js"></script>
  </body>
</html>
